# Continuous integration for Forewarn.
#
# The repository is not a single-language project at its root, which is why the
# GitHub starter workflows could not run here:
#   scorer/            Go module (go.mod lives here, not at the root)
#   ml/                Python pipeline, tested with pytest from this directory
#   deploy/Dockerfile  container build, with the repository root as context
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorer:
    name: Go scorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false          # the scorer has no dependencies, so there is no go.sum to key a cache on

      - name: Format
        working-directory: scorer
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        working-directory: scorer
        run: go vet ./...

      - name: Test
        working-directory: scorer
        run: go test ./...

      - name: Scorer contains no outbound client
        run: make no-egress-check

      - name: Build
        run: make build

      # The committed bundle, its pinned digest and the reference cases must agree
      # with the scorer built from this commit.
      - name: Scorer reproduces the reference decisions
        run: |
          ./bin/forewarn verify \
            -bundle artifacts/bundle/bundle.json \
            -bundle-sha256 "$(cat artifacts/bundle/bundle.sha256)" \
            -cases artifacts/bundle/parity_cases.jsonl

  pipeline:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # With Go present, the end-to-end test also runs the Go scorer against a
      # freshly trained bundle instead of skipping that check.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        working-directory: ml
        run: python -m pytest -q

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only. Nothing is pushed from CI; publishing happens on version tags
      # in docker-publish.yml.
      - name: Build
        run: docker build --file deploy/Dockerfile --tag forewarn-scorer:ci .

      - name: Image runs
        run: docker run --rm forewarn-scorer:ci version
