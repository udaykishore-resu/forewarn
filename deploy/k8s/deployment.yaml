apiVersion: apps/v1
kind: Deployment
metadata:
  name: forewarn-scorer
  namespace: forewarn
  labels:
    app.kubernetes.io/name: forewarn-scorer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forewarn-scorer
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forewarn-scorer
    spec:
      serviceAccountName: forewarn-scorer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: forewarn-scorer
      containers:
        - name: scorer
          # Replace with the image in your own registry, pinned by digest.
          image: forewarn-scorer:0.1.0
          args: ["serve", "-bundle", "/bundle/bundle.json", "-listen", ":8080", "-audit-log", "-"]
          env:
            # The scorer refuses to start if the mounted bundle does not have this digest.
            - name: FOREWARN_BUNDLE_SHA256
              valueFrom:
                configMapKeyRef:
                  name: forewarn-bundle-digest
                  key: sha256
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bundle
              mountPath: /bundle
              readOnly: true
      volumes:
        - name: bundle
          configMap:
            name: forewarn-bundle
